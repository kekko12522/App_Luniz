<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Menu Luniss">
<meta name="application-name" content="Menu Luniss">
<meta name="theme-color" content="#E4DBFF">
<title>Menu Luniss</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='%23E4DBFF'/%3E%3Cpath d='M256 160c-30-22-70-26-100 0-48 42-34 130 6 182 22 29 52 30 94 14 42 16 72 15 94-14 40-52 54-140 6-182-30-26-70-22-100 0z' fill='%23F27A7A'/%3E%3Cellipse cx='198' cy='250' rx='16' ry='34' transform='rotate(18 198 250)' fill='%23fff' opacity='.5'/%3E%3Cpath d='M256 160c0-30 6-52 20-74' stroke='%238A5A3C' stroke-width='14' stroke-linecap='round' fill='none'/%3E%3Cpath d='M280 112c10-38 48-58 86-52-4 40-42 66-86 52z' fill='%236CC38F'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='%23E4DBFF'/%3E%3Cpath d='M256 160c-30-22-70-26-100 0-48 42-34 130 6 182 22 29 52 30 94 14 42 16 72 15 94-14 40-52 54-140 6-182-30-26-70-22-100 0z' fill='%23F27A7A'/%3E%3Cellipse cx='198' cy='250' rx='16' ry='34' transform='rotate(18 198 250)' fill='%23fff' opacity='.5'/%3E%3Cpath d='M256 160c0-30 6-52 20-74' stroke='%238A5A3C' stroke-width='14' stroke-linecap='round' fill='none'/%3E%3Cpath d='M280 112c10-38 48-58 86-52-4 40-42 66-86 52z' fill='%236CC38F'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#F8F6FF; --card:#fff; --ink:#3B3659; --soft:#7C7799; --line:#ECE8F7;
  --lilla:#B9A9EF; --lilla-d:#7A63D6; --menta:#C4EBDC; --pesca:#FFD6C4; --cielo:#CFE6FA; --giallo:#FFF0B8;
  --ok:#5BBF94; --warn:#F0A04B; --bad:#E5645F; --hh:130px;
  --ff-h:'Fredoka',system-ui,sans-serif; --ff-b:'Nunito',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:200px;-webkit-text-size-adjust:100%;touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--ff-b);padding-bottom:96px}
button,label,input,select,a{touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-user-select:none;user-select:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--lilla-d);outline-offset:2px}
h1,h2,h3{font-family:var(--ff-h);font-weight:600;margin:0}
header{position:sticky;top:0;z-index:10;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 10px;background:linear-gradient(160deg,#E4DBFF,#D5ECFB 60%,#D9F3E8)}
.top{display:flex;align-items:center;gap:10px}
.top h1{flex:1;min-width:0;font-size:24px;display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center}
#logo{width:34px;height:34px;border-radius:10px}
.pill{padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.65);font-weight:700;font-size:14px}
.wk{display:flex;align-items:center;gap:8px;margin-top:8px}
.wk>button{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.72);display:grid;place-items:center;font-size:16px}
.wkc{flex:1;position:relative;text-align:center;background:rgba(255,255,255,.72);border-radius:14px;padding:5px 8px;line-height:1.2}
.wkc b{display:block;font-size:15px}
.wkc small{color:var(--soft);font-weight:600;font-size:12.5px}
.wkc input{position:absolute;inset:0;opacity:0;width:100%;height:100%;font-size:16px}
main{max-width:720px;margin:0 auto;padding:14px}
.days{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;position:sticky;top:var(--hh);background:var(--bg);z-index:5;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.dchip{flex:0 0 auto;min-width:58px;padding:8px 6px;border-radius:18px;background:var(--card);border:2px solid var(--line);text-align:center;font-weight:700;line-height:1.15}
.dchip small{display:block;color:var(--soft);font-weight:600}
.dchip.on{background:var(--lilla);border-color:var(--lilla);color:#fff}
.dchip.on small{color:#fff}
.dchip.today{border-color:var(--lilla-d)}
.dchip .dot{display:block;height:6px;margin-top:2px}
.dchip .dot b{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok)}
h2.dtitle{font-size:22px;margin:4px 2px 10px}
.card{background:var(--card);border-radius:22px;padding:14px;margin-bottom:12px;box-shadow:0 2px 14px rgba(122,99,214,.08)}
.meal.done{background:#F2FBF6}
.mh{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.mi{width:38px;height:38px;border-radius:14px;display:grid;place-items:center;font-size:17px;flex:0 0 auto}
.mh h3{flex:1;font-size:19px}
.mealchk{padding:6px 12px;border-radius:999px;background:var(--bg);border:2px solid var(--line);font-weight:700;font-size:14px;display:flex;gap:6px;align-items:center}
.mealchk[aria-pressed=true]{background:var(--ok);border-color:var(--ok);color:#fff}
ul{list-style:none;margin:0;padding:0}
li.it{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px dashed var(--line)}
.ck{width:30px;height:30px;border-radius:50%;border:2px solid var(--lilla);display:grid;place-items:center;color:#fff;flex:0 0 auto}
.ck[aria-pressed=true]{background:var(--ok);border-color:var(--ok)}
.nm{flex:1;min-width:0;text-align:left;font-weight:700;display:flex;flex-direction:column;align-items:flex-start;gap:5px;padding:2px 0}
li.it.eaten .nm .t{text-decoration:line-through;color:var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.x{width:32px;height:32px;border-radius:50%;color:var(--soft);flex:0 0 auto}
.x:hover{background:#FCE9E8;color:var(--bad)}
.add{margin-top:6px;width:100%;padding:9px;border-radius:14px;background:var(--bg);color:var(--lilla-d);font-weight:700;border:2px dashed var(--lilla)}
.chip{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--bg);color:var(--ink);white-space:nowrap}
.chip i{font-size:11px}
.chip.lim{background:#fff;border:1.5px solid #D5CCF7;color:#5B49B0;padding:1px 8px}
.chip.lim.reach{background:#FFE0B5;border-color:#F0A04B;color:#8F500B}
.chip.lim.over{background:#FAC9C6;border-color:#E5645F;color:#9B2B22}
.st{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px}
.st.ok{background:#E2F6EC;color:#2F8F66}.st.reach{background:#FFEBD2;color:#B96A12}.st.over{background:#FDE0DF;color:#C0392B}
.alert{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:16px;margin-bottom:10px;font-weight:600;font-size:14px}
.alert.warn{background:#FFEBD2;color:#8F500B}.alert.bad{background:#FDE0DF;color:#9B2B22}.alert.info{background:var(--cielo);color:#245B84}
.fh{display:flex;align-items:center;gap:10px}
.fh .mi{width:42px;height:42px}
.fh .fn{flex:1;min-width:0}
.fn b{display:block;font-size:17px}
.fn span{font-size:13px;color:var(--soft);font-weight:600}
.cnt{font-family:var(--ff-h);font-size:22px}
.cnt.warn{color:var(--warn)}.cnt.bad{color:var(--bad)}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:10px 0 8px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--ok);transition:width .3s}
.bar i.warn{background:var(--warn)}.bar i.bad{background:var(--bad)}
.frow{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:700;margin-top:8px}
.link{color:var(--lilla-d);font-weight:700;padding:4px 8px;border-radius:10px}
.pri{background:var(--lilla-d);color:#fff;padding:11px 18px;border-radius:14px;font-weight:700}
.ghost{background:var(--bg);padding:11px 18px;border-radius:14px;font-weight:700}
.sec{background:var(--cielo);color:#245B84;padding:11px 18px;border-radius:14px;font-weight:700}
.danger{background:#FDE0DF;color:#9B2B22;padding:11px 18px;border-radius:14px;font-weight:700}
.wide{width:100%;margin-bottom:10px;display:flex;gap:8px;justify-content:center;align-items:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two button{display:flex;gap:8px;justify-content:center;align-items:center;font-size:15px}
.switch{display:flex;gap:10px;align-items:center;font-weight:600;font-size:14px}
.switch input{width:22px;height:22px;accent-color:var(--lilla-d)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.tile{border-radius:20px;padding:12px 8px;text-align:center}
.tile b{display:block;font-family:var(--ff-h);font-size:26px;line-height:1.1}
.tile span{font-size:12.5px;font-weight:700;color:var(--soft)}
.chartbox{position:relative;height:260px}
.bal{display:grid;grid-template-columns:118px 1fr 46px;gap:8px;align-items:center;margin:9px 0;font-size:14px;font-weight:700}
.bal span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bal .bar{margin:0}
.bal em{font-style:normal;color:var(--soft);font-size:13px;text-align:right}
.note{font-size:12.5px;color:var(--soft);margin:8px 0 0}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.empty{text-align:center;color:var(--soft);padding:18px 8px;font-weight:600}
.empty i{display:block;font-size:30px;color:var(--lilla);margin-bottom:6px}
.wrow{width:100%;text-align:left;display:block}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(96vw,540px);display:flex;background:#fff;border-radius:26px;padding:6px;box-shadow:0 6px 28px rgba(80,60,160,.22);z-index:20}
nav button{flex:1;padding:8px 0;border-radius:20px;font-size:10.5px;font-weight:700;color:var(--soft);display:flex;flex-direction:column;gap:2px;align-items:center}
nav button i{font-size:17px}
nav button.on{background:var(--lilla);color:#fff}
dialog{border:0;border-radius:24px;padding:20px;width:min(92vw,420px);max-height:88vh;overflow-y:auto;color:var(--ink);box-shadow:0 12px 50px rgba(40,30,90,.35)}
dialog::backdrop{background:rgba(59,54,89,.4)}
dialog h3{margin-bottom:12px;font-size:21px}
dialog label.f,.lbl{display:block;font-weight:700;font-size:14px;margin-bottom:12px}
.lbl{margin-bottom:6px}
dialog input[type=text],dialog input[type=number]{display:block;width:100%;margin-top:5px;padding:11px 12px;border-radius:12px;border:2px solid var(--line);font:inherit;background:#fff;color:var(--ink)}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
.hint{font-size:13px;color:var(--soft);margin:-4px 0 10px;font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.tag{position:relative;display:block}
.tag input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0}
.tag span{display:flex;gap:6px;align-items:center;padding:9px 13px;border-radius:999px;border:2px solid var(--c);background:#fff;font-weight:700;font-size:14px}
.tag input:checked+span{background:var(--c);color:var(--t)}
.tag input:checked+span::after{content:'\2713';font-weight:700}
.tag input:focus-visible+span{outline:3px solid var(--lilla-d);outline-offset:2px}
.icons{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:14px}
.ic{position:relative;display:block}
.ic input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0}
.ic span{display:grid;place-items:center;height:42px;border-radius:12px;background:var(--bg);border:2px solid transparent;font-size:17px}
.ic input:checked+span{border-color:var(--lilla-d);background:#EFEAFF;color:var(--lilla-d)}
.ic input:focus-visible+span{outline:3px solid var(--lilla-d)}
.sw{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.sw button{width:32px;height:32px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.sw button.on{box-shadow:0 0 0 3px var(--lilla-d)}
.sw input{width:44px;height:36px;padding:0;border:0;background:none}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.age{font:700 12.5px var(--ff-b);background:rgba(255,255,255,.72);border-radius:999px;padding:3px 10px;color:var(--lilla-d);white-space:nowrap}
.chip.over{background:#FAC9C6;color:#9B2B22}
.dh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 2px 10px}
.dh .dtitle{margin:0}
.sm{padding:8px 12px;font-size:14px;display:flex;gap:6px;align-items:center;white-space:nowrap}
.likes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.lk{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px;border-radius:14px;background:var(--bg);border:2px solid var(--line);font-size:11.5px;font-weight:700;color:var(--soft)}
.lk span{font-size:18px;filter:grayscale(1);opacity:.55}
.lk.on{color:var(--ink)}.lk.on span{filter:none;opacity:1}
.lk.on.top{background:#FFF3C4;border-color:#F5CF5B}.lk.on.ok{background:#E2F6EC;border-color:#8FD5B4}.lk.on.no{background:#FDE0DF;border-color:#E9A09C}
.reactadd{margin-top:8px;width:100%;padding:8px;border-radius:14px;color:var(--soft);font-weight:700;font-size:13px;border:2px dashed var(--line)}
.reactrow{margin-top:8px;width:100%;display:flex;gap:8px;align-items:flex-start;text-align:left;padding:9px 12px;border-radius:14px;background:#FDE0DF;color:#9B2B22;font-size:13.5px;font-weight:600}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.seg button{padding:8px 4px;border-radius:14px;background:var(--bg);font-weight:700;font-size:13px;border:2px solid var(--line)}
.seg button.on{background:var(--lilla);border-color:var(--lilla);color:#fff}
.th{font-size:18px;display:flex;gap:8px;align-items:center;margin-bottom:6px}.th i{color:var(--lilla-d)}
.tl{list-style:disc;padding-left:20px;margin:0;font-size:14.5px}.tl li{margin:5px 0}
.ph,.pr{display:grid;grid-template-columns:1.2fr 1fr 1fr;align-items:center;gap:6px;padding:7px 0;font-size:14px}
.ph{font-size:12px;color:var(--soft);font-weight:700;border-bottom:2px solid var(--line)}
.pr{border-bottom:1px dashed var(--line)}
.ph span:last-child{text-align:right}
.pv{justify-self:end;min-width:34px;text-align:center;padding:2px 10px;border-radius:999px;font-weight:700}
.pv.low{background:var(--line);color:var(--soft)}.pv.ok{background:#E2F6EC;color:#2F8F66}.pv.high{background:#FFEBD2;color:#B96A12}
.ta,dialog textarea{display:block;width:100%;margin-top:6px;padding:11px 12px;border-radius:14px;border:2px solid var(--line);font:inherit;font-size:16px;color:var(--ink);background:#fff;resize:vertical}
textarea:focus-visible{outline:3px solid var(--lilla-d);outline-offset:2px}
.reg{border-top:1px dashed var(--line);padding:10px 0}
.regh{display:flex;gap:8px;align-items:center}.regh b{flex:1}.regh span{font-size:13px;color:var(--soft);font-weight:700}
.regd{font-size:14px;margin-top:2px}
#printArea{display:none}
@page{size:A4 landscape;margin:10mm}
@media print{
  html,body{background:#fff!important;padding:0!important}
  header,main,nav,#toast,dialog{display:none!important}
  #printArea{display:block;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #printArea h1{font-size:20px;text-align:center;margin:0 0 8px;color:#3B3659}
  #printArea table{width:100%;border-collapse:collapse;table-layout:fixed;page-break-inside:avoid}
  #printArea th,#printArea td{border:1.5px solid #CFC6EE;padding:4px 7px;vertical-align:top;font-size:11.5px;text-align:left}
  #printArea thead th{background:#E4DBFF;text-align:center;font-size:13px}
  #printArea tbody th{background:#F1EDFF;width:13%;font-size:13px}
  #printArea tbody th small{display:block;font-weight:600;color:#7C7799;font-size:10.5px}
  #printArea tbody tr{height:21mm}
  #printArea td div{margin-bottom:2px}
}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1><img id="logo" alt="" width="34" height="34"><span>Menu Luniss</span><span class="age" id="age"></span></h1>
    <button class="pill" data-act="today"><i class="fa-solid fa-calendar-day"></i> Oggi</button>
  </div>
  <div class="wk">
    <button data-act="prev" aria-label="Settimana precedente"><i class="fa-solid fa-chevron-left"></i></button>
    <div class="wkc"><b id="range"></b><small id="rel"></small><input type="date" id="pick" aria-label="Scegli una data"></div>
    <button data-act="next" aria-label="Settimana successiva"><i class="fa-solid fa-chevron-right"></i></button>
  </div>
</header>
<main id="app"></main>
<nav id="nav" aria-label="Sezioni">
  <button data-tab="menu"><i class="fa-solid fa-calendar-week"></i>Menu</button>
  <button data-tab="types"><i class="fa-solid fa-tags"></i>Tipi</button>
  <button data-tab="limits"><i class="fa-solid fa-gauge-high"></i>Limiti</button>
  <button data-tab="stats"><i class="fa-solid fa-chart-pie"></i>Grafici</button>
  <button data-tab="tips"><i class="fa-solid fa-lightbulb"></i>Consigli</button>
  <button data-tab="more"><i class="fa-solid fa-gear"></i>Altro</button>
</nav>
<input type="file" id="file" accept="application/json,.json" hidden>
<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>
<div id="printArea" aria-hidden="true"></div>

<script>
const KEYS=['menuLuniss.v5','menuLuniss.v4','menuLuniss.v3','menuLuniss.v2','menuBimba.v1'], KEY=KEYS[0];
const DAYS=['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'];
const SHORT=['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];
const MEALS=[
  {k:'colazione',n:'Colazione',i:'fa-mug-hot',c:'#FFE3C9'},
  {k:'spuntino',n:'Spuntino',i:'fa-apple-whole',c:'#FFD1DC'},
  {k:'pranzo',n:'Pranzo',i:'fa-bowl-food',c:'#C4EBDC'},
  {k:'merenda',n:'Merenda',i:'fa-cookie-bite',c:'#FFF0B8'},
  {k:'cena',n:'Cena',i:'fa-moon',c:'#D3D9FA'}
];
const ICONS=['fa-drumstick-bite','fa-bacon','fa-fish','fa-shrimp','fa-egg','fa-cheese','fa-seedling','fa-carrot','fa-leaf','fa-lemon','fa-apple-whole','fa-wheat-awn','fa-bread-slice','fa-bowl-rice','fa-pizza-slice','fa-ice-cream','fa-star','fa-heart'];
const COLORS=['#F6A5A5','#F2B8A0','#FFD966','#B8E3A0','#9ADBB5','#8EC9F0','#B9A9EF','#E3B6EC','#FFB3C7','#CFCBE0'];
const DEFCATS=[
  {id:'carne_bianca',name:'Carne bianca',color:'#FFC9A8',icon:'fa-drumstick-bite'},
  {id:'carne_rossa',name:'Carne rossa',color:'#F6A5A5',icon:'fa-bacon'},
  {id:'pesce',name:'Pesce',color:'#8EC9F0',icon:'fa-fish'},
  {id:'legumi',name:'Legumi',color:'#E3C27E',icon:'fa-seedling'},
  {id:'uova',name:'Uova',color:'#FFD966',icon:'fa-egg'},
  {id:'formaggi',name:'Formaggi',color:'#D9D0FF',icon:'fa-cheese'},

function fresh(){
  return{cats:DEFCATS.map(c=>({...c})),limits:[{id:uid(),name:'Tacchino',max:4,types:[],words:['tacchino']}],weeks:{},history:[],onlyDone:false,pedNote:''};
}
function normalize(o){
  if(!o||typeof o!=='object')throw new Error('formato');
  let weeks=o.weeks;
  if(!weeks&&o.week&&o.week.start)weeks={[o.week.start]:{meals:o.week.meals||{}}};
  if(!weeks||typeof weeks!=='object')throw new Error('formato');
  const legacy=!Array.isArray(o.cats), raw=[];
  let cats;
  if(!legacy){
    cats=o.cats.filter(c=>c&&c.name).map(c=>({id:String(c.id||uid()),name:String(c.name).slice(0,40),color:HEX.test(c.color)?c.color:'#CFCBE0',icon:ICONS.includes(c.icon)?c.icon:'fa-star'}));
    if(Array.isArray(o.limits))o.limits.forEach(l=>raw.push(l));
    else o.cats.forEach(c=>{if(c&&c.name&&(parseInt(c.max,10)||0)>0)raw.push({name:c.name,max:c.max,types:[c.id]})});
  }else{
    if(!Array.isArray(o.foods))throw new Error('formato');
    cats=DEFCATS.map(c=>({...c}));
    o.foods.forEach(f=>{
      if(!f||!f.name)return;
      const d=cats.find(x=>x.name.toLowerCase()===String(f.name).trim().toLowerCase());
      raw.push({name:f.name,max:f.max,types:d?[d.id]:[],words:[String(f.name)]});
    });
  }
  const ids=new Set(cats.map(c=>c.id));
  const limits=raw.filter(l=>l&&l.name).map(l=>({
    id:String(l.id||uid()),name:String(l.name).slice(0,40),max:Math.max(0,parseInt(l.max,10)||0),
    types:(Array.isArray(l.types)?l.types.map(String):[]).filter(x=>ids.has(x)),
    words:(Array.isArray(l.words)?l.words:[]).map(w=>String(w).trim().toLowerCase()).filter(Boolean).slice(0,10)
  })).filter(l=>l.types.length||l.words.length);
  const out={};
  Object.keys(weeks).forEach(k=>{
    if(!/^\d{4}-\d{2}-\d{2}$/.test(k)||!weeks[k]||!weeks[k].meals)return;
    const meals={};
    Object.keys(weeks[k].meals).forEach(mk=>{
      const m=weeks[k].meals[mk];
      if(!MKEY.test(mk)||!m||!Array.isArray(m.items))return;
      const items=m.items.filter(i=>i&&i.name).map(i=>{
        const cs=Array.isArray(i.cats)?i.cats.map(String):(OLDMAP[i.cat]?[OLDMAP[i.cat]]:[]);
        return{id:String(i.id||uid()),name:String(i.name).slice(0,80),cats:[...new Set(cs)].filter(x=>ids.has(x)),done:!!i.done};
      });
      meals[mk]={items,done:items.length>0&&!!m.done,like:LIKES.includes(m.like)?m.like:null,react:cleanReact(m.react)};
    });
    const mk=iso(monday(parse(k)));
    out[mk]={meals:Object.assign(out[mk]?out[mk].meals:{},meals)};
  });
  const history=(Array.isArray(o.history)?o.history:[]).filter(h=>h&&h.start&&h.byCat&&/^\d{4}-\d{2}-\d{2}$/.test(h.start)).map(h=>{
    const byCat={};
    Object.keys(h.byCat).forEach(k=>{const nk=legacy?(OLDMAP[k]||'altro'):k;byCat[nk]=(byCat[nk]||0)+(Number(h.byCat[k])||0)});
    return{id:String(h.id||uid()),start:h.start,total:Number(h.total)||0,meals:Number(h.meals)||0,byCat};
  });
  return{cats,limits,weeks:out,history,onlyDone:!!o.onlyDone,pedNote:typeof o.pedNote==='string'?o.pedNote.slice(0,5000):''};
}
function load(){
  for(const k of KEYS){

  }
  return fresh();
}

/* un piatto rispetta un limite se ha uno dei suoi tipi o se il nome contiene una delle sue parole */
function matches(l,it){
  if(l.types.some(id=>it.cats.includes(id)))return true;
  const n=it.name.toLowerCase();
  return l.words.some(w=>n.includes(w));
}
function counts(week=curWeek()){
  const byCat={},byLimit={};let total=0,meals=0,uncat=0;
  Object.values(week.meals).forEach(m=>{
    if(m.done)meals++;
    m.items.forEach(it=>{
      if(S.onlyDone&&!it.done)return;
      total++;
      const cs=it.cats.filter(id=>cat(id));
      if(!cs.length)uncat++;
      cs.forEach(id=>byCat[id]=(byCat[id]||0)+1);
      S.limits.forEach(l=>{if(matches(l,it))byLimit[l.id]=(byLimit[l.id]||0)+1});
    });
  });
  return{byCat,byLimit,total,meals,uncat};
}
const state=(n,max)=>n>max?'over':n===max&&max>0?'reach':'ok';
const stLabel={ok:'nel limite',reach:'limite raggiunto',over:'limite superato'};

/* ---------- età, consigli, tracker, stampa ---------- */
function ageMonths(now=new Date()){
  const b=parse(BIRTH);
  let m=(now.getFullYear()-b.getFullYear())*12+now.getMonth()-b.getMonth();
  if(now.getDate()<b.getDate())m--;
  return m;
}
function ageLabel(){
  const now=new Date(),m=ageMonths(now);
  if(m<0)return '';
  if(m<1){const d=Math.max(0,Math.floor((now-parse(BIRTH))/864e5));return d+(d===1?' Giorno':' Giorni')}
  if(m<24)return m+(m===1?' Mese':' Mesi');
  const y=Math.floor(m/12),r=m%12;
  return y+(y===1?' Anno':' Anni')+(r?` e ${r} ${r===1?'mese':'mesi'}`:'');
}
const bandOf=m=>m<9?'a':m<12?'b':'c';
function typeCount(ids){
  let n=0;
  Object.values(curWeek().meals).forEach(M=>M.items.forEach(i=>{
    if(S.onlyDone&&!i.done)return;
    if(i.cats.some(c=>ids.includes(c)))n++;
  }));
  return n;
}
function viewTips(){
  const m=ageMonths(),cur=bandOf(Math.max(0,m)),b=tipBand||cur;
  let h=`<div class="card"><div class="fh"><span class="mi" style="background:#FFE3C9"><i class="fa-solid fa-baby"></i></span>
    <div class="fn"><b>${m>=0?'Luna ha '+ageLabel().toLowerCase():'Consigli per età'}</b><span>Scegli la fascia (• = quella attuale)</span></div></div>
    <div class="seg">${Object.keys(TIPS).map(k=>`<button class="${k===b?'on':''}" data-act="tipband" data-b="${k}">${TIPS[k].tab}${k===cur?' •':''}</button>`).join('')}</div></div>`;
  if(m>=0&&m<6)h+=`<div class="alert info"><i class="fa-solid fa-circle-info"></i><span>Prima dei 6 mesi il latte è in genere l'unico alimento necessario: decidi con il pediatra quando iniziare.</span></div>`;
  TIPS[b].sections.forEach(s=>{
    h+=`<div class="card"><h3 class="th"><i class="fa-solid ${s.i}"></i> ${s.t}</h3><ul class="tl">${s.l.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
  });
  h+=`<div class="card"><h3 style="margin-bottom:4px">Frequenze proteiche raccomandate</h3>
    <p class="note" style="margin:0 0 8px">Volte a settimana nella prima infanzia, confrontate con la settimana ${rangeOf(vs)}.</p>
    <div class="ph"><span>Alimento</span><span>Consigliato</span><span>Questa settimana</span></div>
    ${PROT.map(p=>{
      const n=typeCount(p.types),st=n<p.min?'low':n>p.max?'high':'ok';
      return `<div class="pr"><span><b>${p.n}</b></span><span>${p.min===p.max?p.max:p.min+'–'+p.max} volte</span><span class="pv ${st}">${n}</span></div>`;
    }).join('')}
    <p class="note">Grigio: sotto il minimo · verde: nel range · arancione: sopra. Il conteggio usa i tipi Legumi, Pesce, Carne bianca/rossa, Uova e Formaggi.</p>
    <button class="sec wide" data-act="protlimits" style="margin:10px 0 0"><i class="fa-solid fa-gauge-high"></i> Crea limiti con questi massimi</button></div>`;
  h+=`<div class="card"><h3 style="margin-bottom:4px">Note del pediatra</h3>
    <p class="note" style="margin:0">Scrivi qui le indicazioni del medico: si salvano da sole su questo dispositivo.</p>
    <textarea id="pednote" class="ta" rows="6" maxlength="5000" placeholder="Es. visita del... indicazioni, integratori, alimenti da introdurre o evitare">${esc(S.pedNote||'')}</textarea>

  return h;

function regEntries(){
  const out=[];
  Object.keys(S.weeks).forEach(wk=>Object.keys(S.weeks[wk].meals).forEach(mk=>{
    const M=S.weeks[wk].meals[mk];
    if(M.like!=='no'&&!M.react)return;
    const [di,mn]=mk.split('-'),d=addDays(parse(wk),+di);
    out.push({date:d,iso:iso(d),di:+di,mn,M});
  }));
  const ord=MEALS.map(x=>x.k);
  return out.sort((a,b)=>b.iso.localeCompare(a.iso)||ord.indexOf(b.mn)-ord.indexOf(a.mn));
}

const views={menu:viewMenu,types:viewTypes,limits:viewLimits,stats:viewStats,tips:viewTips,more:viewMore};
function relLabel(){
  const d=Math.round((parse(vs)-monday(new Date()))/(7*864e5));
  if(d===0)return 'Settimana corrente';
  if(d===-1)return 'Settimana scorsa';
  if(d===1)return 'Settimana prossima';
  return d<0?`${-d} settimane fa`:`Tra ${d} settimane`;
}
function render(){
  charts.forEach(c=>c.destroy());charts=[];
  $('#range').textContent=rangeOf(vs)+' '+parse(vs).getFullYear();
  $('#rel').textContent=relLabel();
  const al=ageLabel();$('#age').textContent=al?'• '+al:'';
  $('#pick').value=vs;
  $('#app').innerHTML=views[tab]();
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));

}
function drawCharts(){
  const el=$('#ch1');if(!el)return;
  if(typeof Chart==='undefined'){el.parentNode.innerHTML='<p class="note">Grafico non disponibile offline.</p>';return}
  const c=counts(),used=S.cats.filter(t=>c.byCat[t.id]);
  charts.push(new Chart(el,{type:'doughnut',
    data:{labels:used.map(t=>`${t.name} (${c.byCat[t.id]})`),datasets:[{data:used.map(t=>c.byCat[t.id]),backgroundColor:used.map(t=>t.color),borderWidth:3,borderColor:'#fff'}]},

const tagsHtml=(sel)=>S.cats.map(t=>`<label class="tag" style="--c:${t.color};--t:${ink(t.color)}"><input type="checkbox" name="c" value="${t.id}" ${sel.has(t.id)?'checked':''}><span><i class="fa-solid ${t.icon}"></i> ${esc(t.name)}</span></label>`).join('');

    const name=fd.get('n').trim(),max=Math.max(0,parseInt(fd.get('m'),10)||0);
    if(!name)return false;
    const types=fd.getAll('c'),words=fd.get('w').split(',').map(x=>x.trim().toLowerCase()).filter(Boolean).slice(0,10);
    if(!types.length&&!words.length){toast('Scegli almeno un tipo o una parola');return false}
    const dup=S.limits.find(x=>x.name.toLowerCase()===name.toLowerCase());
    if(dup&&(!l||dup.id!==l.id)){toast('Esiste già un limite con questo nome');return false}
    const o={name,max,types,words};
    if(l)Object.assign(l,o);else S.limits.push({id:uid(),...o});
    save();render();
  });
}

/* ---------- backup ---------- */
async function exportData(){
  const name='menu_luniss_backup.json';
  const blob=new Blob([JSON.stringify({app:'menu-luniss',version:5,exportedAt:new Date().toISOString(),...S},null,2)],{type:'application/json'});
  const ios=/iPhone|iPad/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  try{
    const file=new File([blob],name,{type:'application/json'});
    if(ios&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Menu Luniss'});return}
  }catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast('File scaricato');
}
$('#file').addEventListener('change',e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    let data;
    try{data=normalize(JSON.parse(r.result))}
    catch(err){toast('File non valido: scegli un backup JSON di Menu Luniss');return}
    if(!confirm("Sostituire tutti i dati attuali con quelli del file? L'operazione non si può annullare."))return;
    const prev=localStorage.getItem(KEY),str=JSON.stringify(data);
    try{localStorage.setItem(KEY,str);if(localStorage.getItem(KEY)!==str)throw new Error('verifica')}
    catch(err){
      try{prev===null?localStorage.removeItem(KEY):localStorage.setItem(KEY,prev)}catch(e2){}
      toast('Ripristino non riuscito: i dati attuali sono rimasti invariati');return;
    }
    locked=true;clearTimeout(pedT);
    toast('Backup caricato. Ricarico la pagina…');
    setTimeout(()=>location.reload(),1100);
  };
  r.onerror=()=>toast('Impossibile leggere il file');
  r.readAsText(f);
});

/* ---------- azioni ---------- */
document.addEventListener('click',e=>{
  const nav=e.target.closest('[data-tab]');
  if(nav){tab=nav.dataset.tab;render();window.scrollTo(0,0);return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,m=b.dataset.m,id=b.dataset.id;
  if(a==='prev')return setWeek(iso(addDays(parse(vs),-7)),false);
  if(a==='next')return setWeek(iso(addDays(parse(vs),7)),false);
  if(a==='today'){day=(new Date().getDay()+6)%7;return setWeek(iso(monday(new Date())))}
  if(a==='gotoweek'){tab='menu';return setWeek(b.dataset.w)}
  if(a==='day'){day=+b.dataset.i;render();return}
  if(a==='additem')return openItem(m);
  if(a==='edititem')return openItem(m,id);
  if(a==='delitem'){const R=mealRef(day,m);R.items=R.items.filter(x=>x.id!==id);R.done=R.items.length>0&&R.items.every(x=>x.done);save();render();return}
  if(a==='itemdone'){const R=mealRef(day,m),t=R.items.find(x=>x.id===id);t.done=!t.done;R.done=R.items.every(x=>x.done);save();render();return}
  if(a==='mealdone'){const R=mealRef(day,m);
    if(!R.items.length){toast('Aggiungi prima almeno un piatto');return}
    R.done=!R.done;R.items.forEach(x=>x.done=R.done);save();render();return}
  if(a==='addcat')return openCat();
  if(a==='editcat')return openCat(id);
  if(a==='delcat'){
    if(confirm('Eliminare questo tipo? Verrà tolto dai piatti e dai limiti.')){
      S.cats=S.cats.filter(t=>t.id!==id);
      Object.values(S.weeks).forEach(w=>Object.values(w.meals).forEach(M=>M.items.forEach(i=>i.cats=i.cats.filter(x=>x!==id))));
      S.limits.forEach(l=>l.types=l.types.filter(x=>x!==id));
      const gone=S.limits.filter(l=>!l.types.length&&!l.words.length);
      S.limits=S.limits.filter(l=>l.types.length||l.words.length);
      save();render();
      if(gone.length)toast('Limiti rimossi perché senza criteri: '+gone.map(l=>l.name).join(', '));
    }return}
  if(a==='addlim')return openLimit();
  if(a==='editlim')return openLimit(id);
  if(a==='dellim'){if(confirm('Eliminare questo limite?')){S.limits=S.limits.filter(l=>l.id!==id);save();render()}return}
  if(a==='clearweek'){if(confirm('Svuotare il menu di questa settimana?')){delete S.weeks[vs];save();render();toast('Settimana svuotata')}return}
  if(a==='delweek'){if(confirm('Eliminare questa settimana dall\'archivio?')){S.history=S.history.filter(w=>w.id!==id);save();render()}return}
  if(a==='like'){
    const R=mealRef(day,m),v=b.dataset.v;
    R.like=R.like===v?null:v;
    if(R.like&&R.items.length){const eat=R.like!=='no';R.items.forEach(x=>x.done=eat);R.done=eat}
    save();render();return}
  if(a==='react')return openReact(m);
  if(a==='print'){buildPrint();window.print();return}
  if(a==='tipband'){tipBand=b.dataset.b;render();return}
  if(a==='regopen')return openRegistry();
  if(a==='protlimits'){
    if(!confirm('Creare (o aggiornare) un limite per Legumi, Pesce, Carne, Uova e Formaggi con i massimi consigliati?'))return;
    PROT.forEach(p=>{
      const types=p.types.filter(id=>cat(id));if(!types.length)return;
      const nm=p.n+' (consigliato)',ex=S.limits.find(l=>l.name.toLowerCase()===nm.toLowerCase());
      if(ex){ex.max=p.max;ex.types=types}else S.limits.push({id:uid(),name:nm,max:p.max,types,words:[]});
    });
    save();render();toast('Limiti consigliati impostati');return}
  if(a==='export')return exportData();
  if(a==='import')return $('#file').click();
});
document.addEventListener('change',e=>{
  if(e.target.dataset.act==='onlydone'){S.onlyDone=e.target.checked;save();render()}
});
$('#pick').addEventListener('change',e=>{
  if(!e.target.value)return;
  const d=parse(e.target.value);
  day=(d.getDay()+6)%7;setWeek(iso(monday(d)),false);
});
$('#pick').addEventListener('click',e=>{try{e.target.showPicker()}catch(err){}});
window.addEventListener('resize',()=>document.documentElement.style.setProperty('--hh',$('header').offsetHeight+'px'));
document.addEventListener('input',e=>{
  if(e.target.id!=='pednote')return;
  S.pedNote=e.target.value;
  const st=$('#pedst');if(st)st.textContent='Salvataggio…';
  clearTimeout(pedT);
  pedT=setTimeout(()=>{pedT=null;save();const x=$('#pedst');if(x)x.textContent='Salvato'},350);
});
function flushPed(){if(pedT){clearTimeout(pedT);pedT=null;save()}}
window.addEventListener('pagehide',flushPed);
document.addEventListener('visibilitychange',()=>{if(document.hidden)flushPed()});
window.addEventListener('beforeprint',buildPrint);
render();
</script>
