<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E9E3FF">
<title>Menu Bimba</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#F8F6FF; --card:#fff; --ink:#3B3659; --soft:#7C7799; --line:#ECE8F7;
  --lilla:#B9A9EF; --lilla-d:#7A63D6; --menta:#C4EBDC; --pesca:#FFD6C4; --cielo:#CFE6FA; --giallo:#FFF0B8;
  --ok:#5BBF94; --warn:#F0A04B; --bad:#E5645F;
  --ff-h:'Fredoka',system-ui,sans-serif; --ff-b:'Nunito',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:150px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--ff-b);padding-bottom:96px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--lilla-d);outline-offset:2px}
h1,h2,h3{font-family:var(--ff-h);font-weight:600;margin:0}
header{padding:calc(env(safe-area-inset-top,0px) + 18px) 18px 14px;background:linear-gradient(160deg,#E4DBFF,#D5ECFB 60%,#D9F3E8)}
header h1{font-size:28px;display:flex;align-items:center;gap:10px}
header h1 i{color:var(--lilla-d);font-size:24px}
header p{margin:2px 0 0;color:var(--soft);font-weight:600;font-size:14px}
main{max-width:720px;margin:0 auto;padding:14px}
.days{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;position:sticky;top:0;background:var(--bg);z-index:5;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.dchip{flex:0 0 auto;min-width:58px;padding:8px 6px;border-radius:18px;background:var(--card);border:2px solid var(--line);text-align:center;font-weight:700;line-height:1.15}
.dchip small{display:block;color:var(--soft);font-weight:600}
.dchip.on{background:var(--lilla);border-color:var(--lilla);color:#fff}
.dchip.on small{color:#fff}
.dchip.today{border-color:var(--lilla-d)}
.dchip .dot{display:block;height:6px;margin-top:2px}
.dchip .dot b{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok)}
h2.dtitle{font-size:22px;margin:4px 2px 10px}
.card{background:var(--card);border-radius:22px;padding:14px;margin-bottom:12px;box-shadow:0 2px 14px rgba(122,99,214,.08)}
.meal.done{background:#F2FBF6}
.mh{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.mi{width:38px;height:38px;border-radius:14px;display:grid;place-items:center;font-size:17px}
.mh h3{flex:1;font-size:19px}
.mealchk{padding:6px 12px;border-radius:999px;background:var(--bg);border:2px solid var(--line);font-weight:700;font-size:14px;display:flex;gap:6px;align-items:center}
.mealchk[aria-pressed=true]{background:var(--ok);border-color:var(--ok);color:#fff}
ul{list-style:none;margin:0;padding:0}
li.it{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px dashed var(--line)}
.ck{width:30px;height:30px;border-radius:50%;border:2px solid var(--lilla);display:grid;place-items:center;color:#fff;flex:0 0 auto}
.ck[aria-pressed=true]{background:var(--ok);border-color:var(--ok)}
.nm{flex:1;text-align:left;font-weight:700;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:4px 0}
li.it.eaten .nm .t{text-decoration:line-through;color:var(--soft)}
.x{width:32px;height:32px;border-radius:50%;color:var(--soft)}
.x:hover{background:#FCE9E8;color:var(--bad)}
.add{margin-top:6px;width:100%;padding:9px;border-radius:14px;background:var(--bg);color:var(--lilla-d);font-weight:700;border:2px dashed var(--lilla)}
.chip{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--bg);color:var(--soft);white-space:nowrap}
.chip.ok{background:#E2F6EC;color:#2F8F66}.chip.reach{background:#FFEBD2;color:#B96A12}.chip.over{background:#FDE0DF;color:#C0392B}
.alert{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:16px;margin-bottom:10px;font-weight:600;font-size:14px}
.alert.warn{background:#FFEBD2;color:#8F500B}.alert.bad{background:#FDE0DF;color:#9B2B22}.alert.info{background:var(--cielo);color:#245B84}
.alert button{margin-left:auto;font-weight:700;text-decoration:underline;white-space:nowrap}
.fh{display:flex;align-items:center;gap:10px}
.fh .mi{width:42px;height:42px}
.fh .fn{flex:1}
.fn b{display:block;font-size:17px}
.fn span{font-size:13px;color:var(--soft);font-weight:600}
.cnt{font-family:var(--ff-h);font-size:22px}
.cnt.warn{color:var(--warn)}.cnt.bad{color:var(--bad)}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:10px 0 8px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--ok);transition:width .3s}
.bar i.warn{background:var(--warn)}.bar i.bad{background:var(--bad)}
.frow{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:700}
.link{color:var(--lilla-d);font-weight:700;padding:4px 8px;border-radius:10px}
.pri{background:var(--lilla-d);color:#fff;padding:11px 18px;border-radius:14px;font-weight:700}
.ghost{background:var(--bg);padding:11px 18px;border-radius:14px;font-weight:700}
.danger{background:#FDE0DF;color:#9B2B22;padding:11px 18px;border-radius:14px;font-weight:700}
.wide{width:100%;margin-bottom:10px;display:flex;gap:8px;justify-content:center;align-items:center}
.switch{display:flex;gap:10px;align-items:center;font-weight:600;font-size:14px}
.switch input{width:22px;height:22px;accent-color:var(--lilla-d)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.tile{border-radius:20px;padding:12px 8px;text-align:center}
.tile b{display:block;font-family:var(--ff-h);font-size:26px;line-height:1.1}
.tile span{font-size:12.5px;font-weight:700;color:var(--soft)}
.chartbox{position:relative;height:250px}
.bal{display:grid;grid-template-columns:96px 1fr 52px;gap:8px;align-items:center;margin:9px 0;font-size:14px;font-weight:700}
.bal .bar{margin:0}
.bal em{font-style:normal;color:var(--soft);font-size:13px;text-align:right}
.note{font-size:12.5px;color:var(--soft);margin:8px 0 0}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.empty{text-align:center;color:var(--soft);padding:18px 8px;font-weight:600}
.empty i{display:block;font-size:30px;color:var(--lilla);margin-bottom:6px}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(94vw,520px);display:flex;background:#fff;border-radius:26px;padding:6px;box-shadow:0 6px 28px rgba(80,60,160,.22);z-index:20}
nav button{flex:1;padding:8px 2px;border-radius:20px;font-size:12px;font-weight:700;color:var(--soft);display:flex;flex-direction:column;gap:2px;align-items:center}
nav button i{font-size:18px}
nav button.on{background:var(--lilla);color:#fff}
dialog{border:0;border-radius:24px;padding:20px;width:min(92vw,400px);color:var(--ink);box-shadow:0 12px 50px rgba(40,30,90,.35)}
dialog::backdrop{background:rgba(59,54,89,.4)}
dialog h3{margin-bottom:12px;font-size:21px}
dialog label{display:block;font-weight:700;font-size:14px;margin-bottom:12px}
dialog input[type=text],dialog input[type=number],dialog select{display:block;width:100%;margin-top:5px;padding:11px 12px;border-radius:12px;border:2px solid var(--line);font:inherit;background:#fff;color:var(--ink)}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
.hint{font-size:13px;color:var(--soft);margin:-4px 0 10px;min-height:18px;font-weight:600}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1><i class="fa-solid fa-seedling"></i> Menu Bimba</h1>
  <p id="range"></p>
</header>
<main id="app"></main>
<nav id="nav" aria-label="Sezioni">
  <button data-tab="menu"><i class="fa-solid fa-calendar-week"></i>Menu</button>
  <button data-tab="foods"><i class="fa-solid fa-gauge-high"></i>Limiti</button>
  <button data-tab="stats"><i class="fa-solid fa-chart-pie"></i>Statistiche</button>
  <button data-tab="weeks"><i class="fa-solid fa-clock-rotate-left"></i>Settimane</button>
</nav>
<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>

<script>
const KEY='menuBimba.v1';
const DAYS=['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'];
const SHORT=['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];
const MEALS=[
  {k:'colazione',n:'Colazione',i:'fa-mug-hot',c:'#FFE3C9'},
  {k:'spuntino',n:'Spuntino',i:'fa-apple-whole',c:'#FFD1DC'},
  {k:'pranzo',n:'Pranzo',i:'fa-bowl-food',c:'#C4EBDC'},
  {k:'merenda',n:'Merenda',i:'fa-cookie-bite',c:'#FFF0B8'},
  {k:'cena',n:'Cena',i:'fa-moon',c:'#D3D9FA'}
];
const CATS={
  carne:{n:'Carne',i:'fa-drumstick-bite',c:'#F6A5A5',t:3},
  pesce:{n:'Pesce',i:'fa-fish',c:'#8EC9F0',t:3},
  legumi:{n:'Legumi',i:'fa-seedling',c:'#E3C27E',t:3},
  uova:{n:'Uova',i:'fa-egg',c:'#FFD966',t:2},
  latticini:{n:'Latticini',i:'fa-cheese',c:'#D9D0FF',t:7},
  cereali:{n:'Cereali',i:'fa-wheat-awn',c:'#F2C9A0',t:10},
  verdure:{n:'Verdure',i:'fa-carrot',c:'#9ADBB5',t:14},
  frutta:{n:'Frutta',i:'fa-lemon',c:'#FFB3C7',t:14},
  altro:{n:'Altro',i:'fa-star',c:'#CFCBE0',t:0}
};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const monday=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const fmt=d=>d.toLocaleDateString('it-IT',{day:'numeric',month:'short'});
const rangeOf=s=>{const a=parse(s);return fmt(a)+' – '+fmt(addDays(a,6))};

function fresh(){
  return{
    foods:[
      {id:uid(),name:'Tacchino',cat:'carne',max:4},
      {id:uid(),name:'Pesce',cat:'pesce',max:3},
      {id:uid(),name:'Legumi',cat:'legumi',max:3},
      {id:uid(),name:'Uova',cat:'uova',max:2}
    ],
    week:{start:iso(monday(new Date())),meals:{}},
    history:[],
    onlyDone:false
  };
}
function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.week&&s.foods)return s}catch(e){}
  return fresh();
}
let S=load(), tab='menu', day=(new Date().getDay()+6)%7, charts=[];
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Impossibile salvare i dati')}}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2600)}

const mealKey=(d,k)=>d+'-'+k;
const getMeal=(d,k)=>S.week.meals[mealKey(d,k)]||{items:[],done:false};
const mealRef=(d,k)=>(S.week.meals[mealKey(d,k)]=S.week.meals[mealKey(d,k)]||{items:[],done:false});
const findFood=n=>{n=n.trim().toLowerCase();return S.foods.find(f=>f.name.trim().toLowerCase()===n)};
function allItems(){return Object.values(S.week.meals).flatMap(m=>m.items)}

function counts(week=S.week, foods=S.foods, onlyDone=S.onlyDone){
  const byFood={},byCat={};let total=0,meals=0;
  Object.values(week.meals).forEach(m=>{
    if(m.done)meals++;
    m.items.forEach(it=>{
      if(onlyDone&&!it.done)return;
      const f=foods.find(x=>x.name.trim().toLowerCase()===it.name.trim().toLowerCase());
      const c=f?f.cat:it.cat;
      if(f)byFood[f.id]=(byFood[f.id]||0)+1;
      byCat[c]=(byCat[c]||0)+1;total++;
    });
  });
  return{byFood,byCat,total,meals};
}
function state(n,max){return n>max?'over':n===max&&max>0?'reach':'ok'}
const stLabel={ok:'nel limite',reach:'limite raggiunto',over:'limite superato'};

/* ---------- viste ---------- */
function viewMenu(){
  const c=counts();
  let h='';
  const nowMon=iso(monday(new Date()));
  if(nowMon>S.week.start){
    h+=`<div class="alert info"><i class="fa-solid fa-calendar-plus"></i><span>È iniziata una nuova settimana.</span><button data-act="newweek">Inizia nuova</button></div>`;
  }
  S.foods.forEach(f=>{
    const n=c.byFood[f.id]||0,s=state(n,f.max);
    if(s!=='ok')h+=`<div class="alert ${s==='over'?'bad':'warn'}"><i class="fa-solid fa-triangle-exclamation"></i><span>${esc(f.name)}: ${n}/${f.max}, ${stLabel[s]}.</span></div>`;
  });
  h+='<div class="days" role="tablist">'+DAYS.map((_,i)=>{
    const dt=addDays(parse(S.week.start),i);
    const done=MEALS.every(m=>getMeal(i,m.k).done);
    const isToday=iso(dt)===iso(new Date());
    return `<button class="dchip ${i===day?'on':''} ${isToday?'today':''}" data-act="day" data-i="${i}" aria-label="${DAYS[i]} ${dt.getDate()}"><small>${SHORT[i]}</small>${dt.getDate()}<span class="dot">${done?'<b></b>':''}</span></button>`;
  }).join('')+'</div>';
  h+=`<h2 class="dtitle">${DAYS[day]} ${fmt(addDays(parse(S.week.start),day))}</h2>`;
  MEALS.forEach(m=>{
    const M=getMeal(day,m.k);
    h+=`<section class="card meal ${M.done?'done':''}">
      <div class="mh"><span class="mi" style="background:${m.c}"><i class="fa-solid ${m.i}"></i></span><h3>${m.n}</h3>
      <button class="mealchk" data-act="mealdone" data-m="${m.k}" aria-pressed="${M.done}"><i class="fa-solid fa-check"></i>${M.done?'Mangiato':'Da fare'}</button></div>
      <ul>${M.items.map(it=>{
        const f=findFood(it.name);let chip='';
        if(f){const n=c.byFood[f.id]||0,s=state(n,f.max);chip=`<span class="chip ${s}">${n}/${f.max}</span>`}
        return `<li class="it ${it.done?'eaten':''}">
          <button class="ck" data-act="itemdone" data-m="${m.k}" data-id="${it.id}" aria-pressed="${!!it.done}" aria-label="Segna come mangiato">${it.done?'<i class="fa-solid fa-check"></i>':''}</button>
          <button class="nm" data-act="edititem" data-m="${m.k}" data-id="${it.id}"><span class="t">${esc(it.name)}</span>${chip}</button>
          <button class="x" data-act="delitem" data-m="${m.k}" data-id="${it.id}" aria-label="Rimuovi ${esc(it.name)}"><i class="fa-solid fa-xmark"></i></button></li>`;
      }).join('')}</ul>
      <button class="add" data-act="additem" data-m="${m.k}"><i class="fa-solid fa-plus"></i> Aggiungi alimento</button></section>`;
  });
  return h;
}

function viewFoods(){
  const c=counts();
  let h=`<button class="pri wide" data-act="addfood"><i class="fa-solid fa-plus"></i> Nuovo alimento con limite</button>`;
  h+=`<label class="card switch"><input type="checkbox" data-act="onlydone" ${S.onlyDone?'checked':''}><span>Conta solo gli alimenti segnati come mangiati</span></label>`;
  if(!S.foods.length)h+=`<div class="empty"><i class="fa-solid fa-gauge-high"></i>Aggiungi un alimento e imposta quante volte a settimana può comparire nel menu.</div>`;
  S.foods.forEach(f=>{
    const n=c.byFood[f.id]||0,s=state(n,f.max),cat=CATS[f.cat]||CATS.altro;
    const cls=s==='over'?'bad':s==='reach'?'warn':'';
    const pct=f.max>0?Math.min(100,n/f.max*100):(n?100:0);
    h+=`<div class="card"><div class="fh"><span class="mi" style="background:${cat.c}"><i class="fa-solid ${cat.i}"></i></span>
      <div class="fn"><b>${esc(f.name)}</b><span>${cat.n} · max ${f.max} a settimana</span></div>
      <div class="cnt ${cls}">${n}/${f.max}</div></div>
      <div class="bar"><i class="${cls}" style="width:${pct}%"></i></div>
      <div class="frow"><span class="chip ${s}">${stLabel[s]}</span>
      <span><button class="link" data-act="editfood" data-id="${f.id}">Modifica</button><button class="link" style="color:var(--bad)" data-act="delfood" data-id="${f.id}">Elimina</button></span></div></div>`;
  });
  return h;
}

function viewStats(){
  const c=counts();
  const over=S.foods.filter(f=>(c.byFood[f.id]||0)>=f.max&&f.max>0).length;
  let h=`<div class="tiles">
    <div class="tile" style="background:var(--menta)"><b>${c.meals}</b><span>pasti mangiati</span></div>
    <div class="tile" style="background:var(--cielo)"><b>${c.total}</b><span>alimenti</span></div>
    <div class="tile" style="background:${over?'var(--pesca)':'var(--giallo)'}"><b>${over}</b><span>limiti raggiunti</span></div></div>`;
  if(!c.total)return h+`<div class="card empty"><i class="fa-solid fa-chart-pie"></i>Inserisci qualche alimento nel menu per vedere le statistiche.</div>`;
  h+=`<div class="card"><h3 style="margin-bottom:8px">Cosa è stato dato</h3><div class="chartbox"><canvas id="ch1"></canvas></div></div>`;
  const keys=Object.keys(CATS).filter(k=>CATS[k].t>0);
  const lacking=keys.filter(k=>(c.byCat[k]||0)<CATS[k].t*0.5).map(k=>CATS[k].n.toLowerCase());
  h+=`<div class="card"><h3>Bilanciamento</h3>`;
  keys.forEach(k=>{
    const n=c.byCat[k]||0,t=CATS[k].t,p=Math.min(100,n/t*100);
    h+=`<div class="bal"><span><i class="fa-solid ${CATS[k].i}" style="color:${CATS[k].c}"></i> ${CATS[k].n}</span><div class="bar"><i style="width:${p}%;background:${CATS[k].c}"></i></div><em>${n}/${t}</em></div>`;
  });
  h+=lacking.length?`<div class="alert info" style="margin-top:12px"><i class="fa-solid fa-lightbulb"></i><span>Finora poco presenti: ${lacking.join(', ')}.</span></div>`
    :`<div class="alert info" style="margin-top:12px"><i class="fa-solid fa-circle-check"></i><span>Buona varietà: nessuna categoria è molto indietro.</span></div>`;
  h+=`<p class="note">I valori a destra sono porzioni settimanali indicative, solo come riferimento. Per le quantità giuste per tua figlia chiedi al pediatra.</p></div>`;
  return h;
}

function viewWeeks(){
  const c=counts();
  let h=`<div class="card"><h3>Settimana corrente</h3><p class="note" style="margin:2px 0 12px">${rangeOf(S.week.start)} · ${c.total} alimenti, ${c.meals} pasti mangiati</p>
    <button class="pri wide" data-act="newweek"><i class="fa-solid fa-box-archive"></i> Archivia e inizia nuova settimana</button>
    <button class="danger wide" data-act="clearweek"><i class="fa-solid fa-eraser"></i> Svuota senza archiviare</button></div>`;
  h+=`<h2 class="dtitle">Storico</h2>`;
  if(!S.history.length)h+=`<div class="card empty"><i class="fa-solid fa-clock-rotate-left"></i>Le settimane archiviate compariranno qui.</div>`;
  S.history.slice().reverse().forEach(w=>{
    h+=`<div class="card"><div class="fh"><div class="fn"><b>${rangeOf(w.start)}</b><span>${w.total} alimenti · ${w.meals} pasti mangiati</span></div>
      <button class="x" data-act="delweek" data-id="${w.id}" aria-label="Elimina settimana"><i class="fa-solid fa-trash"></i></button></div>
      <div class="cats">${Object.keys(w.byCat).map(k=>`<span class="chip" style="background:${(CATS[k]||CATS.altro).c}55">${(CATS[k]||CATS.altro).n} ${w.byCat[k]}</span>`).join('')}</div>
      ${w.over.length?`<p class="note"><i class="fa-solid fa-triangle-exclamation" style="color:var(--warn)"></i> Limiti raggiunti: ${w.over.map(esc).join(', ')}</p>`:''}</div>`;
  });
  return h;
}

/* ---------- render ---------- */
const views={menu:viewMenu,foods:viewFoods,stats:viewStats,weeks:viewWeeks};
function render(){
  charts.forEach(c=>c.destroy());charts=[];
  $('#range').textContent='Settimana '+rangeOf(S.week.start);
  $('#app').innerHTML=views[tab]();
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  if(tab==='stats')drawCharts();
}
function drawCharts(){
  const el=$('#ch1');if(!el)return;
  if(typeof Chart==='undefined'){el.parentNode.innerHTML='<p class="note">Grafico non disponibile offline.</p>';return}
  const c=counts(),ks=Object.keys(c.byCat);
  charts.push(new Chart(el,{type:'doughnut',
    data:{labels:ks.map(k=>CATS[k].n),datasets:[{data:ks.map(k=>c.byCat[k]),backgroundColor:ks.map(k=>CATS[k].c),borderWidth:3,borderColor:'#fff'}]},
    options:{maintainAspectRatio:false,cutout:'58%',plugins:{legend:{position:'bottom',labels:{usePointStyle:true,font:{family:'Nunito',weight:'700'}}}}}}));
}

/* ---------- dialoghi ---------- */
const dlg=$('#dlg');
const catOpts=sel=>Object.keys(CATS).map(k=>`<option value="${k}" ${k===sel?'selected':''}>${CATS[k].n}</option>`).join('');
function openDlg(html,onSubmit){
  dlg.innerHTML=html;
  const f=dlg.querySelector('form');
  f.addEventListener('submit',e=>{e.preventDefault();if(onSubmit(new FormData(f))!==false)dlg.close()});
  dlg.querySelector('[data-close]').onclick=()=>dlg.close();
  dlg.showModal();
  return f;
}
function openItem(m,id){
  const M=getMeal(day,m),it=id?M.items.find(x=>x.id===id):null;
  const f=openDlg(`<form><h3>${it?'Modifica alimento':'Aggiungi alimento'}</h3>
    <label>Alimento<input type="text" name="n" list="fl" required autocomplete="off" value="${esc(it?it.name:'')}"></label>
    <datalist id="fl">${S.foods.map(x=>`<option value="${esc(x.name)}">`).join('')}</datalist>
    <label>Tipo<select name="c">${catOpts(it?it.cat:'altro')}</select></label>
    <p class="hint" id="hint"></p>
    <div class="row"><button type="button" class="ghost" data-close>Annulla</button><button class="pri">Salva</button></div></form>`,fd=>{
    const name=fd.get('n').trim();if(!name)return false;
    const food=findFood(name),cat=food?food.cat:fd.get('c');
    const R=mealRef(day,m);
    if(it){const t=R.items.find(x=>x.id===id);t.name=name;t.cat=cat}
    else R.items.push({id:uid(),name,cat,done:false});
    R.done=R.items.length>0&&R.items.every(x=>x.done);
    save();render();
    if(food){const n=counts().byFood[food.id]||0;
      if(n>food.max)toast(`Attenzione: ${food.name} supera il limite (${n}/${food.max})`);
      else if(n===food.max)toast(`${food.name}: limite settimanale raggiunto (${n}/${food.max})`)}
  });
  const inp=f.elements.n,sel=f.elements.c,hint=f.querySelector('#hint');
  const sync=()=>{const fo=findFood(inp.value);
    if(fo){sel.value=fo.cat;sel.disabled=true;hint.textContent=`Limite: max ${fo.max} a settimana`}
    else{sel.disabled=false;hint.textContent=''}};
  inp.addEventListener('input',sync);sync();
  sel.form.addEventListener('formdata',e=>{if(sel.disabled)e.formData.set('c',sel.value)});
  if(!it)setTimeout(()=>inp.focus(),50);
}
function openFood(id){
  const fo=id?S.foods.find(x=>x.id===id):null;
  openDlg(`<form><h3>${fo?'Modifica limite':'Nuovo alimento'}</h3>
    <label>Nome<input type="text" name="n" required autocomplete="off" value="${esc(fo?fo.name:'')}"></label>
    <label>Tipo<select name="c">${catOpts(fo?fo.cat:'carne')}</select></label>
    <label>Massimo a settimana<input type="number" name="m" min="0" max="35" inputmode="numeric" required value="${fo?fo.max:3}"></label>
    <div class="row"><button type="button" class="ghost" data-close>Annulla</button><button class="pri">Salva</button></div></form>`,fd=>{
    const name=fd.get('n').trim(),max=Math.max(0,parseInt(fd.get('m'),10)||0);
    if(!name)return false;
    const dup=findFood(name);
    if(dup&&(!fo||dup.id!==fo.id)){toast('Esiste già un alimento con questo nome');return false}
    if(fo){fo.name=name;fo.cat=fd.get('c');fo.max=max}
    else S.foods.push({id:uid(),name,cat:fd.get('c'),max});
    save();render();
  });
}

/* ---------- azioni ---------- */
function newWeek(archive){
  const c=counts();
  if(archive&&(c.total>0||c.meals>0)){
    S.history.push({id:uid(),start:S.week.start,total:c.total,meals:c.meals,byCat:c.byCat,
      over:S.foods.filter(f=>f.max>0&&(c.byFood[f.id]||0)>=f.max).map(f=>`${f.name} ${c.byFood[f.id]}/${f.max}`)});
    if(S.history.length>104)S.history.shift();
  }
  let n=monday(new Date());
  if(iso(n)<=S.week.start)n=addDays(parse(S.week.start),7);
  S.week={start:iso(n),meals:{}};
  day=Math.max(0,Math.min(6,Math.round((new Date()-n)/864e5)));
  if(new Date()<n)day=0;
  save();render();window.scrollTo(0,0);
  toast(archive?'Settimana archiviata, contatori azzerati':'Settimana svuotata');
}
document.addEventListener('click',e=>{
  const nav=e.target.closest('[data-tab]');
  if(nav){tab=nav.dataset.tab;render();window.scrollTo(0,0);return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,m=b.dataset.m,id=b.dataset.id;
  if(a==='day'){day=+b.dataset.i;render();return}
  if(a==='additem')return openItem(m);
  if(a==='edititem')return openItem(m,id);
  if(a==='delitem'){const R=mealRef(day,m);R.items=R.items.filter(x=>x.id!==id);R.done=R.items.length>0&&R.items.every(x=>x.done);save();render();return}
  if(a==='itemdone'){const R=mealRef(day,m),t=R.items.find(x=>x.id===id);t.done=!t.done;R.done=R.items.every(x=>x.done);save();render();return}
  if(a==='mealdone'){const R=mealRef(day,m);
    if(!R.items.length){toast('Aggiungi prima almeno un alimento');return}
    R.done=!R.done;R.items.forEach(x=>x.done=R.done);save();render();return}
  if(a==='addfood')return openFood();
  if(a==='editfood')return openFood(id);
  if(a==='delfood'){if(confirm('Eliminare questo limite? Gli alimenti già nel menu restano.')){S.foods=S.foods.filter(f=>f.id!==id);save();render()}return}
  if(a==='newweek'){if(confirm('Archiviare la settimana e iniziarne una nuova? I contatori ripartono da zero.'))newWeek(true);return}
  if(a==='clearweek'){if(confirm('Svuotare la settimana senza archiviarla?'))newWeek(false);return}
  if(a==='delweek'){if(confirm('Eliminare questa settimana dallo storico?')){S.history=S.history.filter(w=>w.id!==id);save();render()}return}
});
document.addEventListener('change',e=>{
  if(e.target.dataset.act==='onlydone'){S.onlyDone=e.target.checked;save();render()}
});
render();
</script>
</body>
</html>
